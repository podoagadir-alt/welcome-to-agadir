<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventaire cuisine · Welcome to Agadir</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173449;background:#f6f8f9}*{box-sizing:border-box}body{margin:0}.hero{background:#143b55;color:white;padding:30px 20px}.wrap{max-width:700px;margin:auto}.eyebrow{color:#dfc596;font-size:12px;letter-spacing:2px}h1{font-size:29px;margin:16px 0 5px}p{line-height:1.5}.main{padding:20px}.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}.btn,button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cdd9df;background:white;color:#173449;border-radius:10px;padding:10px 13px}.active,.primary{background:#143b55;color:white;border-color:#143b55}.hint{background:#e9f1f4;border-radius:12px;padding:13px;margin:18px 0;font-size:14px}.section{background:white;border:1px solid #e0e8ec;border-radius:14px;margin:15px 0;overflow:hidden}.section h2{font-size:17px;margin:0;padding:16px;background:#f2f6f8}.item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid #edf0f2;gap:10px}.qty{font-weight:700;background:#f2f6f8;border-radius:7px;padding:5px 12px}.controls{display:flex;align-items:center;gap:8px}.controls button{padding:5px 11px}.report{background:white;padding:18px;border-radius:14px;border:1px solid #e0e8ec;margin-top:18px}label{display:block;margin:12px 0 5px}select,textarea{width:100%;padding:10px;border:1px solid #cdd9df;border-radius:9px}textarea{min-height:75px}.hidden{display:none}footer{text-align:center;color:#637785;font-size:12px;padding:30px}.small{font-size:12px;color:#647785}
</style></head><body><header class="hero"><div class="wrap"><div class="eyebrow">WELCOME TO AGADIR · RÉSIDENCE HIBA · 214</div><h1 id="title">Votre cuisine</h1><p id="subtitle">Inventaire des équipements et ustensiles</p><button id="lang" onclick="toggleLang()">English</button></div></header><main class="wrap main"><div class="bar"><button id="guestBtn" class="active" onclick="setMode('guest')">Voyageur</button><button id="ownerBtn" onclick="setMode('owner')">Gestion (démo)</button></div><div class="hint" id="hint"></div><div id="inventory"></div><div class="report" id="report"><h2 id="reportTitle"></h2><label id="itemLabel"></label><select id="itemSelect"></select><label id="issueLabel"></label><select id="issueSelect"></select><label id="detailsLabel"></label><textarea id="details"></textarea><p class="small" id="whatsappNote"></p><button class="primary" id="sendBtn" onclick="sendReport()"></button></div><div id="ownerNote" class="hint hidden"></div></main><footer>WELCOME TO AGADIR · <span id="foot">Votre confort, notre priorité</span></footer><script>
const names=[['Bols','Bowls',4,0],['Assiettes','Plates',4,0],['Tasses','Cups',6,0],['Verres à eau','Water glasses',6,0],['Fourchettes','Forks',6,1],['Couteaux','Knives',6,1],['Cuillères','Spoons',6,1],['Petites cuillères','Teaspoons',6,1],['Casseroles','Saucepans',3,2],['Poêles','Frying pans',2,2],['Spatule','Spatula',1,2],['Louche','Ladle',1,2],['Passoire','Colander',1,2],['Four','Oven',1,3],['Micro-ondes','Microwave',1,3],['Machine à café','Coffee machine',1,3],['Lave-vaisselle','Dishwasher',1,3],['Bouilloire','Kettle',1,3]];
const categories=[['Vaisselle','Tableware'],['Couverts','Cutlery'],['Ustensiles','Cookware'],['Électroménager','Appliances']];
let lang='fr',mode='guest',qty=names.map(x=>x[2]);
const $=id=>document.getElementById(id), en=()=>lang==='en';
function toggleLang(){lang=en()?'fr':'en';render()}
function setMode(m){mode=m;render()}
function change(i,d){qty[i]=Math.max(0,qty[i]+d);render()}
function render(){
document.documentElement.lang=lang;
$('title').textContent=en()?'Your kitchen':'Votre cuisine';
$('subtitle').textContent=en()?'Kitchen equipment and utensils inventory':'Inventaire des équipements et ustensiles';
$('lang').textContent=en()?'Français':'English';
$('guestBtn').textContent=en()?'Guest':'Voyageur';$('ownerBtn').textContent=en()?'Management (demo)':'Gestion (démo)';
$('guestBtn').className=mode==='guest'?'active':'';$('ownerBtn').className=mode==='owner'?'active':'';
$('hint').textContent=mode==='guest'?(en()?'Please report missing or damaged items found on arrival within 24 hours.':'Merci de signaler tout objet manquant ou endommagé constaté à l’arrivée dans les 24 premières heures.'):(en()?'DEMO ONLY: quantities changed here are not saved or protected.':'DÉMONSTRATION : les quantités modifiées ici ne sont ni enregistrées ni protégées.');
$('inventory').replaceChildren();
categories.forEach((c,g)=>{let box=document.createElement('section');box.className='section';let h=document.createElement('h2');h.textContent=c[en()?1:0];box.append(h);names.forEach((x,i)=>{if(x[3]!==g)return;let row=document.createElement('div');row.className='item';let label=document.createElement('span');label.textContent=x[en()?1:0];row.append(label);if(mode==='owner'){let ctr=document.createElement('div');ctr.className='controls';let minus=document.createElement('button');minus.textContent='−';minus.onclick=()=>change(i,-1);let val=document.createElement('b');val.textContent=qty[i];let plus=document.createElement('button');plus.textContent='+';plus.onclick=()=>change(i,1);ctr.append(minus,val,plus);row.append(ctr)}else{let q=document.createElement('span');q.className='qty';q.textContent=qty[i];row.append(q)}box.append(row)});$('inventory').append(box)});
$('report').classList.toggle('hidden',mode!=='guest');$('ownerNote').classList.toggle('hidden',mode!=='owner');
$('ownerNote').textContent=en()?'The published GitHub Pages site is public. A real private management area requires authentication and separate storage.':'Le site GitHub Pages est public. Un véritable espace privé nécessitera une authentification et un stockage séparé.';
$('reportTitle').textContent=en()?'Report an issue':'Signaler un problème';
$('itemLabel').textContent=en()?'Item':'Article concerné';$('issueLabel').textContent=en()?'Issue':'Problème';$('detailsLabel').textContent=en()?'Details (optional)':'Précisions (facultatif)';
let old=$('itemSelect').value;$('itemSelect').replaceChildren();names.forEach((x,i)=>{let o=new Option(x[en()?1:0],i);$('itemSelect').add(o)});$('itemSelect').value=old||'0';
let oldIssue=$('issueSelect').value;$('issueSelect').replaceChildren();[['missing','Manquant','Missing'],['broken','Cassé','Broken'],['damaged','Endommagé','Damaged']].forEach(x=>$('issueSelect').add(new Option(x[en()?2:1],x[0])));$('issueSelect').value=oldIssue||'missing';
$('whatsappNote').textContent=en()?'WhatsApp number not configured yet. The message can be copied.':'Numéro WhatsApp non configuré : vous pourrez copier le message.';
$('sendBtn').textContent=en()?'Copy report message':'Copier le signalement';$('foot').textContent=en()?'Your comfort, our priority':'Votre confort, notre priorité';
}
async function sendReport(){let i=Number($('itemSelect').value),issue=$('issueSelect').selectedOptions[0].textContent,details=$('details').value.trim();let msg=`Welcome to Agadir — Appartement 214\nArticle : ${names[i][0]}\nProblème : ${issue}${details?'\nPrécisions : '+details:''}`;try{await navigator.clipboard.writeText(msg);alert(en()?'Message copied.':'Message copié.')}catch(e){prompt(en()?'Copy this message:':'Copiez ce message :',msg)}}
render();
</script></body></html>
